services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:?DEPLOYMENT_ENV is required}
      DEPLOYMENT_VERSION: ${DEPLOYMENT_VERSION:-unknown}
      OUTBOUND_INTEGRATIONS_DISABLED: ${OUTBOUND_INTEGRATIONS_DISABLED:?OUTBOUND_INTEGRATIONS_DISABLED is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      QUEUE_PREFIX: ${QUEUE_PREFIX:?QUEUE_PREFIX is required}
      CHANNEL_CREDENTIALS_ENCRYPTION_KEY: ${CHANNEL_CREDENTIALS_ENCRYPTION_KEY:?CHANNEL_CREDENTIALS_ENCRYPTION_KEY is required}
      CHANNEL_CREDENTIALS_KEY_ID: ${CHANNEL_CREDENTIALS_KEY_ID:?CHANNEL_CREDENTIALS_KEY_ID is required}
      CHANNEL_CREDENTIALS_PREVIOUS_KEY: ${CHANNEL_CREDENTIALS_PREVIOUS_KEY:-}
      CHANNEL_CREDENTIALS_PREVIOUS_KEY_ID: ${CHANNEL_CREDENTIALS_PREVIOUS_KEY_ID:-}
      PROVIDER_EVENT_ENCRYPTION_KEY: ${PROVIDER_EVENT_ENCRYPTION_KEY:?PROVIDER_EVENT_ENCRYPTION_KEY is required}
      PROVIDER_EVENT_KEY_ID: ${PROVIDER_EVENT_KEY_ID:?PROVIDER_EVENT_KEY_ID is required}
      PROVIDER_EVENT_PREVIOUS_KEY: ${PROVIDER_EVENT_PREVIOUS_KEY:-}
      PROVIDER_EVENT_PREVIOUS_KEY_ID: ${PROVIDER_EVENT_PREVIOUS_KEY_ID:-}
      PROVIDER_EVENT_RETENTION_DAYS: ${PROVIDER_EVENT_RETENTION_DAYS:-30}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:?META_WEBHOOK_VERIFY_TOKEN is required}
      META_APP_SECRET: ${META_APP_SECRET:?META_APP_SECRET is required}
      EVOLUTION_FOUNDATION_WEBHOOK_SECRET: ${EVOLUTION_FOUNDATION_WEBHOOK_SECRET}
      OBJECT_STORAGE_ENABLED: ${OBJECT_STORAGE_ENABLED:?OBJECT_STORAGE_ENABLED is required}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      WEBHOOK_RATE_LIMIT_ORIGIN: ${WEBHOOK_RATE_LIMIT_ORIGIN:-120}
      WEBHOOK_RATE_LIMIT_CONNECTION: ${WEBHOOK_RATE_LIMIT_CONNECTION:-600}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: ["npm", "run", "worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:?DEPLOYMENT_ENV is required}
      OUTBOUND_INTEGRATIONS_DISABLED: ${OUTBOUND_INTEGRATIONS_DISABLED:?OUTBOUND_INTEGRATIONS_DISABLED is required}
      QUEUE_PREFIX: ${QUEUE_PREFIX:?QUEUE_PREFIX is required}
      HEALTH_PORT: "3001"
      CHANNEL_CREDENTIALS_ENCRYPTION_KEY: ${CHANNEL_CREDENTIALS_ENCRYPTION_KEY:?CHANNEL_CREDENTIALS_ENCRYPTION_KEY is required}
      CHANNEL_CREDENTIALS_KEY_ID: ${CHANNEL_CREDENTIALS_KEY_ID:?CHANNEL_CREDENTIALS_KEY_ID is required}
      PROVIDER_EVENT_ENCRYPTION_KEY: ${PROVIDER_EVENT_ENCRYPTION_KEY:?PROVIDER_EVENT_ENCRYPTION_KEY is required}
      PROVIDER_EVENT_KEY_ID: ${PROVIDER_EVENT_KEY_ID:?PROVIDER_EVENT_KEY_ID is required}
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: ["npm", "run", "scheduler"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:?DEPLOYMENT_ENV is required}
      OUTBOUND_INTEGRATIONS_DISABLED: ${OUTBOUND_INTEGRATIONS_DISABLED:?OUTBOUND_INTEGRATIONS_DISABLED is required}
      QUEUE_PREFIX: ${QUEUE_PREFIX:?QUEUE_PREFIX is required}
      HEALTH_PORT: "3002"
      OUTBOX_POLL_INTERVAL_MS: "5000"
      CHANNEL_CREDENTIALS_ENCRYPTION_KEY: ${CHANNEL_CREDENTIALS_ENCRYPTION_KEY:?CHANNEL_CREDENTIALS_ENCRYPTION_KEY is required}
      CHANNEL_CREDENTIALS_KEY_ID: ${CHANNEL_CREDENTIALS_KEY_ID:?CHANNEL_CREDENTIALS_KEY_ID is required}
      PROVIDER_EVENT_ENCRYPTION_KEY: ${PROVIDER_EVENT_ENCRYPTION_KEY:?PROVIDER_EVENT_ENCRYPTION_KEY is required}
      PROVIDER_EVENT_KEY_ID: ${PROVIDER_EVENT_KEY_ID:?PROVIDER_EVENT_KEY_ID is required}
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
